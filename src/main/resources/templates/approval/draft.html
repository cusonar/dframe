<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>기안 작성</title>
</head>
<body>
<nav class="flex" aria-label="Breadcrumb" layout:fragment="breadcrumb">
  <ol class="inline-flex" th:classappend="${@environment.getProperty('style.breadcrumb')}">
    <li class="inline-flex items-center"><a href="/" th:classappend="${@environment.getProperty('style.breadcrumb_item')}"><i class="fas fa-home mr-2"></i> Home</a></li>
    <li><div class="flex items-center"><i class="fas fa-chevron-right text-gray-400 mx-1 text-xs"></i><span class="ml-1" th:classappend="${@environment.getProperty('style.breadcrumb_item')}">전자 결재</span></div></li>
    <li aria-current="page"><div class="flex items-center"><i class="fas fa-chevron-right text-gray-400 mx-1 text-xs"></i><span class="ml-1" th:classappend="${@environment.getProperty('style.tabs')}">기안 작성</span></div></li>
  </ol>
</nav>

<div layout:fragment="content" class="flex-1 overflow-y-auto bg-gray-50 dark:bg-gray-900 p-4">
    <div class="bg-white dark:bg-gray-800 shadow-md rounded-lg p-6 max-w-4xl mx-auto">
        <h2 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white">새 기안서 작성</h2>
        <form action="/approval/draft" method="post">
            <div class="mb-4">
                <label for="title" th:classappend="${@environment.getProperty('style.label')}">문서 제목</label>
                <input type="text" id="title" name="title" th:classappend="${@environment.getProperty('style.input')}" required>
            </div>
            
            <div class="mb-4">
                <label for="approvers" th:classappend="${@environment.getProperty('style.label')}">결재선 지정 (순서대로 선택)</label>
                <select id="approvers" name="approverIds" multiple th:classappend="${@environment.getProperty('style.input')}" style="height: 120px;" required>
                    <option th:each="emp : ${employees}" th:value="${emp.id}" th:text="${emp.name + ' (' + emp.jobTitle + ')'}">홍길동 (부장)</option>
                </select>
                <p class="text-xs text-gray-500 mt-1">cmd(mac) 또는 ctrl(win)을 누르고 여러 명을 클릭하세요.</p>
            </div>
            
            <div class="mb-6">
                <label for="content" th:classappend="${@environment.getProperty('style.label')}">상세 내용</label>
                <textarea id="content" name="content" rows="10" th:classappend="${@environment.getProperty('style.input')}" placeholder="기안 내용을 입력하세요..." required></textarea>
            </div>
            
            <div class="flex justify-end gap-2">
                <a href="/" class="focus:ring-gray-200" th:classappend="${@environment.getProperty('style.button_alternative')}">취소</a>
                <button type="submit" th:classappend="${@environment.getProperty('style.button')}">기안 상신</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
