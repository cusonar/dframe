<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>결재 대기함</title>
</head>
<body>
<th:block layout:fragment="breadcrumb">
    <th:block th:replace="~{fragments/breadcrumb :: breadcrumb('전자 결재', '결재 대기함')}"></th:block>
</th:block>

<div layout:fragment="content" class="flex-1 overflow-hidden flex flex-col min-h-0 p-4">
    <div class="bg-white dark:bg-gray-800 shadow-md rounded-lg flex-1 flex flex-col overflow-hidden">
        <div class="p-4 border-b dark:border-gray-700">
            <h2 class="text-lg font-semibold text-gray-900 dark:text-white">나의 결재 대기 문서</h2>
        </div>
        
        <div class="overflow-x-auto flex-1">
            <table th:classappend="${@environment.getProperty('style.table')}">
                <thead class="sticky top-0" th:classappend="${@environment.getProperty('style.table_head')}">
                    <tr>
                        <th scope="col" class="px-4 py-3">문서 번호</th>
                        <th scope="col" class="px-4 py-3">제목</th>
                        <th scope="col" class="px-4 py-3">기안자</th>
                        <th scope="col" class="px-4 py-3">기안일시</th>
                        <th scope="col" class="px-4 py-3 text-center">결재 처리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="line : ${pendingLines}" th:classappend="${@environment.getProperty('style.table_row')}">
                        <td class="px-4 py-3" th:text="${line.document.id}">1</td>
                        <td class="px-4 py-3" th:classappend="${@environment.getProperty('style.label')}" th:text="${line.document.title}">휴가 신청서</td>
                        <td class="px-4 py-3" th:text="${line.document.drafter.name}">기안자명</td>
                        <td class="px-4 py-3" th:text="${#temporals.format(line.document.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-07 10:00</td>
                        <td class="px-4 py-3 text-center">
                            <form th:action="@{'/approval/process/' + ${line.id}}" method="post" class="inline-flex rounded-md shadow-sm" role="group">
                                <button type="submit" name="action" value="approve" class="px-3 py-1.5 text-xs font-medium text-white bg-green-600 border border-transparent rounded-l-lg hover:bg-green-700 focus:z-10 focus:ring-2 focus:ring-green-500 dark:bg-green-500 dark:hover:bg-green-600">
                                    승인
                                </button>
                                <button type="submit" name="action" value="reject" class="px-3 py-1.5 text-xs font-medium text-white bg-red-600 border border-transparent rounded-r-lg hover:bg-red-700 focus:z-10 focus:ring-2 focus:ring-red-500 dark:bg-red-500 dark:hover:bg-red-600 ml-[-1px]">
                                    반려
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(pendingLines)}">
                        <td colspan="5" class="px-4 py-8 text-center text-gray-500">결재 대기 중인 문서가 없습니다.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
