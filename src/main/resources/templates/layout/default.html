<!DOCTYPE html>
<html lang="ko" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1" name="viewport">
        <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE"
               th:text="${@environment.getProperty('spring.application.name')}">dframe</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script th:src="@{/TreeGrid/GridE.js}"></script>
        <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet"/>
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
        <script>
            // 페이지 로드 시 깜빡임 방지를 위해 즉시 사이드바 상태 적용
            if (localStorage.getItem('sidebar-collapsed') === 'true') {
                document.documentElement.classList.add('sidebar-collapsed');
            }
        </script>
        <style>
            /* 사이드바 아이콘 공통 정렬 (펼침/접힘 무관하게 박스 내 정중앙 위치) */
            #drawer-navigation a i,
            #drawer-navigation button i:first-child {
                display: flex;
                justify-content: center;
                align-items: center;
                text-align: center;
            }

            @media (min-width: 768px) {

                /* 사이드바 축소 상태 CSS */
                html.sidebar-collapsed #drawer-navigation {
                    width: 4rem !important;
                }

                html.sidebar-collapsed #main-content {
                    margin-left: 4rem !important;
                }

                html.sidebar-collapsed .sidebar-group-title {
                    display: none !important;
                }

                html.sidebar-collapsed #drawer-navigation a,
                html.sidebar-collapsed #drawer-navigation button {
                    justify-content: center !important;
                    padding-left: 0 !important;
                    padding-right: 0 !important;
                    width: 100%;
                }

                html.sidebar-collapsed #drawer-navigation a span,
                html.sidebar-collapsed #drawer-navigation button span,
                html.sidebar-collapsed #drawer-navigation button i.fa-chevron-down {
                    display: none !important;
                }

                html.sidebar-collapsed #drawer-navigation a i,
                html.sidebar-collapsed #drawer-navigation button i:first-child {
                    margin: 0 !important;
                    text-align: center;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                }

                html.sidebar-collapsed #drawer-navigation .px-3 {
                    padding-left: 0 !important;
                    padding-right: 0 !important;
                }

                /* 부드러운 애니메이션 전환 효과 */
                #drawer-navigation,
                #main-content {
                    transition: width 0.3s ease, margin-left 0.3s ease;
                }
            }

            .GridMain input {
                padding: 0 !important;
                border: none;
                background-color: transparent;
            }

            .GridMain input:focus {
                box-shadow: none;
            }
        </style>
    </head>

    <body class="bg-gray-50 dark:bg-gray-900 antialiased">

        <th:block th:replace="~{fragments/header :: headerFragment}"></th:block>
        <th:block th:replace="~{fragments/sidebar :: sidebarFragment}"></th:block>

        <main class="pt-12 px-3 md:ml-64 h-screen flex flex-col overflow-hidden" id="main-content">
            <div class="mb-2 flex items-center justify-between shrink-0">
                <h1 class="pt-2 text-sm font-bold text-gray-900 dark:text-white" th:text="${title}">Page Title</h1>
                <th:block layout:fragment="breadcrumb">
                    <th:block th:replace="~{fragments/breadcrumb :: breadcrumb('', ${title})}"></th:block>
                </th:block>
            </div>

            <!-- 가운데 영역이 나머지를 모두 차지하도록 flex-1 및 overflow 처리 -->
            <div class="flex-1 overflow-hidden flex flex-col min-h-0" layout:fragment="content">
                <!-- 페이지별 내용 영역 -->
            </div>

            <div class="shrink-0 mt-4">
                <th:block th:replace="~{fragments/footer :: footerFragment}"></th:block>
            </div>
        </main>

        <th:block th:replace="~{fragments/toast :: toastFragment}"></th:block>
        <th:block th:replace="~{fragments/modal :: modalFragment}"></th:block>
        <th:block th:replace="~{fragments/iconModal :: iconModalFragment}"></th:block>

        <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"></script>
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const toggleBtn = document.getElementById('desktop-sidebar-toggle');
                if (toggleBtn) {
                    toggleBtn.addEventListener('click', function () {
                        const html = document.documentElement;
                        html.classList.toggle('sidebar-collapsed');
                        const isCollapsed = html.classList.contains('sidebar-collapsed');
                        localStorage.setItem('sidebar-collapsed', isCollapsed);
                        
                        // Alpine store 상태 동기화
                        if (window.Alpine && Alpine.store('sidebar')) {
                            Alpine.store('sidebar').isCollapsed = isCollapsed;
                        }
                    });
                }
            });
        </script>
        <th:block layout:fragment="script"></th:block>
    </body>

</html>
