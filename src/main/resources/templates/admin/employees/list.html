<!DOCTYPE html>
<html layout:decorate="~{layout/default}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:th="http://www.thymeleaf.org">

<head>
    <title>사용자 관리</title>
</head>

<body>
    <th:block layout:fragment="breadcrumb">
        <th:block th:replace="~{fragments/breadcrumb :: breadcrumb('시스템 관리', '직원 관리')}"></th:block>
    </th:block>

    <div class="flex-1 overflow-hidden flex min-h-0" layout:fragment="content">
        <div class="flex-1 shadow-md flex flex-col min-h-0" th:classappend="${@environment.getProperty('style.card')}">
            <div class="p-3 justify-between items-center shrink-0"
                th:classappend="${@environment.getProperty('style.tabs')}">
                <h3 class="text-md font-semibold text-gray-900 dark:text-white">직원 목록</h3>
                <button class="text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-xs px-3 py-1.5"
                    onclick="prepareCreate()" type="button">
                    <i class="fas fa-save mr-1"></i> 저장
                </button>
            </div>
            <div class="p-3 border-b border-gray-200 dark:border-gray-700 shrink-0">
                <input class="p-2" id="treeFilter" onkeyup="filterTree()" placeholder="이름, 아이디, 부서명 검색..."
                    th:classappend="${@environment.getProperty('style.input')}" type="text">
            </div>
            <div class="p-3 overflow-hidden flex-1" id="empTreeGrid">
                <treegrid Data_Url="/api/employees?treeGrid=true" Layout_Url="/grid/adminEmployeeLayout.js"></treegrid>
            </div>
        </div>
    </div>
    <th:block layout:fragment="script">
        <script th:inline="javascript">

        </script>
    </th:block>
</body>

</html>
