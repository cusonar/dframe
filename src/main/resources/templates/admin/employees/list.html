<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>사용자 관리</title>
</head>
<body>
<nav class="flex" aria-label="Breadcrumb" layout:fragment="breadcrumb">
  <ol class="inline-flex items-center space-x-1 md:space-x-2 rtl:space-x-reverse">
    <li class="inline-flex items-center"><a href="/" class="text-sm font-medium text-gray-700 hover:text-blue-600 dark:text-gray-400 dark:hover:text-white"><i class="fas fa-home mr-2"></i> Home</a></li>
    <li><div class="flex items-center"><i class="fas fa-chevron-right text-gray-400 mx-1 text-xs"></i><span class="text-sm font-medium text-gray-700 dark:text-gray-400 ml-1">시스템 관리</span></div></li>
    <li aria-current="page"><div class="flex items-center"><i class="fas fa-chevron-right text-gray-400 mx-1 text-xs"></i><span class="text-sm font-medium text-gray-500 dark:text-gray-400 ml-1">직원 관리</span></div></li>
  </ol>
</nav>

<div layout:fragment="content" class="flex-1 overflow-hidden flex flex-col min-h-0 relative">
    <div class="flex-1 flex flex-col md:flex-row min-h-0 gap-4 p-4">
        
        <!-- 좌측: 사용자 트리 (1/3) -->
        <div class="w-full md:w-1/3 bg-white dark:bg-gray-800 shadow-md rounded-lg flex flex-col min-h-0 border border-gray-200 dark:border-gray-700">
            <div class="p-3 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center shrink-0">
                <h3 class="text-md font-semibold text-gray-900 dark:text-white">직원 목록</h3>
                <button type="button" onclick="prepareCreate()" class="text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-xs px-3 py-1.5">
                    <i class="fas fa-plus mr-1"></i> 사용자 추가
                </button>
            </div>
            <div class="p-3 border-b border-gray-200 dark:border-gray-700 shrink-0">
                <input type="text" id="treeFilter" onkeyup="filterTree()" placeholder="이름, 아이디, 부서명 검색..." class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
            </div>
            <div class="p-4 overflow-y-auto flex-1">
                <!-- Unassigned Users -->
                <ul class="space-y-1 mb-2" th:if="${not #lists.isEmpty(unassignedUsers)}">
                    <li th:each="emp : ${unassignedUsers}" class="tree-node user-node">
                        <div class="flex items-center p-1.5 hover:bg-gray-100 dark:hover:bg-gray-600 rounded transition-colors group">
                            <div class="w-6 h-6 flex items-center justify-center mr-1">
                                <i class="fas fa-minus text-gray-300 dark:text-gray-600 text-xs"></i>
                            </div>
                            <div class="flex-1 cursor-pointer flex items-center p-1 rounded"
                                 th:data-id="${emp.id}" th:data-username="${emp.username}" th:data-name="${emp.name}"
                                 th:data-department=""
                                 th:data-enabled="${emp.enabled}"
                                 th:data-roles="${#strings.listJoin(emp.roles.![id], ',')}"
                                 onclick="showUserDetails(this)">
                                <i class="fas fa-user text-blue-500 dark:text-blue-400 mr-2"></i>
                                <span class="text-sm font-medium text-gray-700 dark:text-gray-200 node-name" th:text="${emp.name} + ' (' + ${emp.username} + ')'"></span>
                            </div>
                        </div>
                    </li>
                </ul>

                <!-- Tree rendering -->
                <ul class="space-y-1">
                    <th:block th:with="rootDepts=${departments.?[parent == null]}">
                        <th:block th:replace="~{admin/employees/list :: deptUserTree(${rootDepts}, 0)}"></th:block>
                    </th:block>
                </ul>
            </div>
        </div>

        <!-- 우측: 사용자 상세 (2/3) -->
        <div class="w-full md:w-2/3 bg-white dark:bg-gray-800 shadow-md rounded-lg flex flex-col min-h-0 border border-gray-200 dark:border-gray-700">
            <div class="p-3 border-b border-gray-200 dark:border-gray-700 shrink-0">
                <h3 id="detailPanelTitle" class="text-md font-semibold text-gray-900 dark:text-white">사용자 상세 정보</h3>
            </div>
            <div class="p-6 overflow-y-auto flex-1 relative">
                <div id="emptySelectionMsg" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 bg-white dark:bg-gray-800 z-10">
                    <i class="fas fa-user-circle text-4xl mb-3 text-gray-300 dark:text-gray-600"></i>
                    <p>좌측 트리에서 사용자를 선택하거나 새 사용자를 추가하세요.</p>
                </div>
                
                <form id="employeeForm" action="/admin/employees" method="post">
                    <div class="grid gap-4 mb-4 grid-cols-2">
                        <div class="col-span-2 sm:col-span-1">
                            <label for="username" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">아이디 <span class="text-red-500">*</span></label>
                            <input type="text" name="username" id="username" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white" required>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">이름 <span class="text-red-500">*</span></label>
                            <input type="text" name="name" id="name" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white" required>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label id="passwordLabel" for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">비밀번호 <span class="text-red-500" id="passwordRequiredStar">*</span></label>
                            <input type="password" name="password" id="password" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white" required>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label for="department" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">부서</label>
                            <select id="department" name="departmentId" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
                                <option value="">부서 선택 (선택사항)</option>
                                <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                            </select>
                        </div>
                        <div class="col-span-2">
                            <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">역할 부여</label>
                            <div class="flex flex-wrap gap-4">
                                <div class="flex items-center" th:each="role : ${roles}">
                                    <input th:id="'role-' + ${role.id}" type="checkbox" name="roleIds" th:value="${role.id}" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:bg-gray-700 dark:border-gray-600">
                                    <label th:for="'role-' + ${role.id}" class="ms-2 text-sm font-medium text-gray-900 dark:text-gray-300" th:text="${role.name}">ROLE</label>
                                </div>
                            </div>
                        </div>
                        <div class="col-span-2">
                            <label class="inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="enabled" name="enabled" value="true" class="sr-only peer" checked>
                                <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
                                <span class="ms-3 text-sm font-medium text-gray-900 dark:text-gray-300">계정 활성화</span>
                            </label>
                        </div>
                    </div>
                    <div class="flex justify-between pt-4 mt-6 border-t border-gray-200 dark:border-gray-700">
                        <div>
                            <button type="button" id="btnDelete" onclick="deleteUser()" class="hidden py-2.5 px-5 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 focus:ring-4 focus:outline-none focus:ring-red-300">삭제</button>
                        </div>
                        <div class="flex space-x-2">
                            <button type="button" onclick="cancelSelection()" class="py-2.5 px-5 text-sm font-medium text-gray-900 bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-blue-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700">취소</button>
                            <button type="submit" id="btnSave" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">등록</button>
                        </div>
                    </div>
                </form>
                <form id="deleteForm" method="post" class="hidden"></form>
            </div>
        </div>
    </div>

    <!-- 재귀적 트리 조각 -->
    <th:block th:fragment="deptUserTree(deptList, level)" th:if="${deptList != null and not #lists.isEmpty(deptList)}">
        <ul th:classappend="${level > 0} ? 'ml-4 space-y-1 border-l border-gray-200 dark:border-gray-700 pl-2 mt-1' : 'space-y-1'">
            <li th:each="dept : ${deptList}" class="tree-node dept-node">
                <div class="flex items-center p-1.5 hover:bg-gray-100 dark:hover:bg-gray-600 rounded transition-colors group">
                    <button type="button" class="w-6 h-6 flex items-center justify-center mr-1 rounded hover:bg-gray-200 dark:hover:bg-gray-500" 
                            th:if="${not #lists.isEmpty(dept.children) or not #lists.isEmpty(dept.employees)}" onclick="toggleNode(this, event)">
                        <i class="fas fa-chevron-down text-gray-500 dark:text-gray-400 text-xs transition-transform duration-200"></i>
                    </button>
                    <div class="w-6 h-6 flex items-center justify-center mr-1" th:if="${#lists.isEmpty(dept.children) and #lists.isEmpty(dept.employees)}">
                        <i class="fas fa-minus text-gray-300 dark:text-gray-600 text-xs"></i>
                    </div>
                    <div class="flex-1 cursor-default flex items-center p-1 rounded">
                        <i class="fas fa-building text-gray-500 dark:text-gray-400 mr-2"></i>
                        <span class="text-sm font-medium text-gray-700 dark:text-gray-200 node-name" th:text="${dept.name}"></span>
                    </div>
                </div>
                
                <th:block th:if="${not #lists.isEmpty(dept.children) or not #lists.isEmpty(dept.employees)}">
                    <div class="tree-children">
                        <!-- Render Users in this Department -->
                        <ul th:if="${not #lists.isEmpty(dept.employees)}" class="ml-4 space-y-1 border-l border-gray-200 dark:border-gray-700 pl-2 mt-1">
                            <li th:each="emp : ${dept.employees}" class="tree-node user-node">
                                <div class="flex items-center p-1.5 hover:bg-gray-100 dark:hover:bg-gray-600 rounded transition-colors group">
                                    <div class="w-6 h-6 flex items-center justify-center mr-1">
                                        <i class="fas fa-minus text-gray-300 dark:text-gray-600 text-xs"></i>
                                    </div>
                                    <div class="flex-1 cursor-pointer flex items-center p-1 rounded"
                                         th:data-id="${emp.id}" th:data-username="${emp.username}" th:data-name="${emp.name}"
                                         th:data-department="${dept.id}"
                                         th:data-enabled="${emp.enabled}"
                                         th:data-roles="${#strings.listJoin(emp.roles.![id], ',')}"
                                         onclick="showUserDetails(this)">
                                        <i class="fas fa-user text-blue-500 dark:text-blue-400 mr-2"></i>
                                        <span class="text-sm font-medium text-gray-700 dark:text-gray-200 node-name" th:text="${emp.name} + ' (' + ${emp.username} + ')'"></span>
                                    </div>
                                </div>
                            </li>
                        </ul>
                        <!-- Render Child Departments -->
                        <th:block th:replace="~{admin/employees/list :: deptUserTree(${dept.children}, ${level + 1})}"></th:block>
                    </div>
                </th:block>
            </li>
        </ul>
    </th:block>
</div>

<th:block layout:fragment="script">
<script>
    let currentMode = ''; 
    let currentId = null;

    function prepareCreate() {
        currentMode = 'create';
        currentId = null;
        
        document.getElementById('emptySelectionMsg').style.display = 'none';
        document.getElementById('detailPanelTitle').textContent = '새 사용자 등록';
        document.getElementById('employeeForm').action = '/admin/employees';
        
        document.getElementById('username').value = '';
        document.getElementById('username').disabled = false;
        document.getElementById('username').classList.remove('bg-gray-100');
        document.getElementById('username').classList.add('bg-gray-50');

        document.getElementById('name').value = '';
        
        const pwdInput = document.getElementById('password');
        pwdInput.value = '';
        pwdInput.required = true;
        document.getElementById('passwordLabel').innerHTML = '비밀번호 <span class="text-red-500">*</span>';
        
        document.getElementById('department').value = '';
        document.getElementById('enabled').checked = true;
        
        document.querySelectorAll('input[name="roleIds"]').forEach(cb => cb.checked = false);
        
        document.getElementById('btnDelete').classList.add('hidden');
        document.getElementById('btnSave').textContent = '등록';
        
        highlightTreeNode(null);
    }

    function showUserDetails(element) {
        currentMode = 'edit';
        currentId = element.getAttribute('data-id');
        const username = element.getAttribute('data-username');
        const name = element.getAttribute('data-name');
        const departmentId = element.getAttribute('data-department');
        const enabled = element.getAttribute('data-enabled') === 'true';
        const roles = element.getAttribute('data-roles') ? element.getAttribute('data-roles').split(',') : [];
        
        document.getElementById('emptySelectionMsg').style.display = 'none';
        document.getElementById('detailPanelTitle').textContent = '사용자 정보 수정';
        document.getElementById('employeeForm').action = '/admin/employees/' + currentId;
        
        const usernameInput = document.getElementById('username');
        usernameInput.value = username;
        usernameInput.disabled = true; 
        usernameInput.classList.remove('bg-gray-50');
        usernameInput.classList.add('bg-gray-100');

        document.getElementById('name').value = name;
        
        const pwdInput = document.getElementById('password');
        pwdInput.value = '';
        pwdInput.required = false;
        document.getElementById('passwordLabel').innerHTML = '비밀번호 (변경 시 입력)';
        
        document.getElementById('department').value = departmentId || '';
        document.getElementById('enabled').checked = enabled;
        
        document.querySelectorAll('input[name="roleIds"]').forEach(cb => cb.checked = false);
        roles.forEach(roleId => {
            if (roleId.trim() !== '') {
                const cb = document.getElementById('role-' + roleId.trim());
                if (cb) cb.checked = true;
            }
        });
        
        document.getElementById('btnDelete').classList.remove('hidden');
        document.getElementById('btnSave').textContent = '저장';
        
        highlightTreeNode(element);
    }

    function cancelSelection() {
        document.getElementById('emptySelectionMsg').style.display = 'flex';
        document.getElementById('employeeForm').reset();
        highlightTreeNode(null);
    }

    function deleteUser() {
        if (!currentId) return;
        if (confirm('이 사용자를 정말 삭제하시겠습니까?')) {
            const deleteForm = document.getElementById('deleteForm');
            deleteForm.action = '/admin/employees/' + currentId + '/delete';
            deleteForm.submit();
        }
    }

    function highlightTreeNode(activeElement) {
        document.querySelectorAll('div[data-id]').forEach(el => {
            el.classList.remove('bg-blue-50', 'dark:bg-gray-700', 'text-blue-700', 'dark:text-blue-400');
        });
        
        if (activeElement) {
            activeElement.classList.add('bg-blue-50', 'dark:bg-gray-700');
        }
    }

    function toggleNode(btn, event) {
        event.stopPropagation();
        const li = btn.closest('li.tree-node');
        const childrenContainer = li.querySelector(':scope > .tree-children');
        const icon = btn.querySelector('i');
        
        if (childrenContainer) {
            if (childrenContainer.classList.contains('hidden')) {
                childrenContainer.classList.remove('hidden');
                icon.classList.remove('-rotate-90');
            } else {
                childrenContainer.classList.add('hidden');
                icon.classList.add('-rotate-90');
            }
        }
    }

    function filterTree() {
        const query = document.getElementById('treeFilter').value.toLowerCase();
        const allLis = document.querySelectorAll('li.tree-node');
        
        if (query.trim() === '') {
            allLis.forEach(li => li.style.display = '');
            return;
        }
        
        allLis.forEach(li => li.style.display = 'none');
        
        allLis.forEach(li => {
            const nameSpan = li.querySelector('.node-name');
            if (nameSpan && nameSpan.textContent.toLowerCase().includes(query)) {
                li.style.display = '';
                
                let parent = li.parentElement.closest('li.tree-node');
                while (parent) {
                    parent.style.display = '';
                    const childrenContainer = parent.querySelector(':scope > .tree-children');
                    if (childrenContainer) childrenContainer.classList.remove('hidden');
                    const icon = parent.querySelector(':scope > div > button i');
                    if (icon) icon.classList.remove('-rotate-90');
                    
                    parent = parent.parentElement.closest('li.tree-node');
                }
            }
        });
    }
</script>
</th:block>
</body>
</html>
