<!DOCTYPE html>
<html layout:decorate="~{layout/default}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org"
      xmlns:x-transition="http://www.w3.org/1999/xhtml">
    <head>
        <title>메뉴 관리</title>
    </head>
    <body>
        <th:block layout:fragment="breadcrumb">
            <th:block th:replace="~{fragments/breadcrumb :: breadcrumb('시스템 관리', '메뉴 관리')}"></th:block>
        </th:block>

        <div class="flex-1 overflow-hidden flex flex-col min-h-0 relative" id="content"
             layout:fragment="content"
             x-data="menuPageData()">
            <div class="flex-1 flex flex-col md:flex-row min-h-0 gap-4">

                <!-- 좌측: 메뉴 트리 (1/3) -->
                <div class="w-full md:w-1/3 bg-white dark:bg-gray-800 shadow-md rounded-lg flex flex-col min-h-0 border border-gray-200 dark:border-gray-700">
                    <div class="p-3 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center shrink-0">
                        <h3 class="text-md font-semibold text-gray-900 dark:text-white">메뉴 구조</h3>
                        <button @click="openNew()" class="text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-xs px-3 py-1.5"
                                type="button">
                            <i class="fas fa-plus mr-1"></i> 메뉴 추가
                        </button>
                    </div>
                    <div class="flex-1 p-3">
                        <treegrid Data_Url="/api/admin/menus?treeGrid=true" Layout_Url="/grid/adminMenuLayout.js"
                                  debug="1"></treegrid>
                    </div>
                </div>

                <!-- 우측: 메뉴 상세 (2/3) -->
                <div class="w-full md:w-2/3 bg-white dark:bg-gray-800 shadow-md rounded-lg flex flex-col min-h-0 border border-gray-200 dark:border-gray-700">
                    <div class="p-3 border-b border-gray-200 dark:border-gray-700 shrink-0">
                        <h3 class="text-md font-semibold text-gray-900 dark:text-white" id="detailPanelTitle"
                            x-text="mode === 'new' ? '신규 메뉴 등록' : '메뉴 상세 / 수정'"></h3>
                    </div>
                    <div class="p-6 overflow-y-auto flex-1 relative">
                        <div class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 bg-white dark:bg-gray-800 z-10" id="emptySelectionMsg"
                             x-show="Object.keys(detail).length === 0">
                            <i class="fas fa-list-ul text-4xl mb-3 text-gray-300 dark:text-gray-600"></i>
                            <p>좌측 트리에서 메뉴를 선택하거나 새 메뉴를 추가하세요.</p>
                        </div>

                        <form id="menuForm" x-show="Object.keys(detail).length > 0">
                            <div class="grid gap-3 mb-4 grid-cols-2">
                                <!-- 메뉴 코드 -->
                                <div class="col-span-2 sm:col-span-1">
                                    <label for="code" th:classappend="${@environment.getProperty('style.label_sm')}">
                                        메뉴코드 <span class="text-red-500">*</span>
                                    </label>
                                    <input :disabled="mode !== 'new'" id="code"
                                           required
                                           th:classappend="${@environment.getProperty('style.input_sm')}"
                                           type="text"
                                           x-model="detail.code">
                                </div>

                                <!-- 메뉴명 -->
                                <div class="col-span-2 sm:col-span-1">
                                    <label for="name" th:classappend="${@environment.getProperty('style.label_sm')}">
                                        메뉴명 <span class="text-red-500">*</span>
                                    </label>
                                    <input id="name" required
                                           th:classappend="${@environment.getProperty('style.input_sm')}"
                                           type="text"
                                           x-model="detail.name">
                                </div>

                                <!-- 경로(URL) -->
                                <div class="col-span-2 sm:col-span-1">
                                    <label for="url" th:classappend="${@environment.getProperty('style.label_sm')}">경로(URL)</label>
                                    <input id="url" placeholder="예: /admin/users"
                                           th:classappend="${@environment.getProperty('style.input_sm')}"
                                           type="text"
                                           x-model="detail.url">
                                </div>

                                <!-- 정렬 순서 -->
                                <div class="col-span-2 sm:col-span-1">
                                    <label for="sortOrder"
                                           th:classappend="${@environment.getProperty('style.label_sm')}">
                                        정렬 순서 <span class="text-red-500">*</span>
                                    </label>
                                    <input id="sortOrder" min="1" required
                                           th:classappend="${@environment.getProperty('style.input_sm')}"
                                           type="number"
                                           x-model.number="detail.sortOrder">
                                </div>

                                <!-- 아이콘 선택 (비주얼 픽커) -->
                                <div class="col-span-2 sm:col-span-1">
                                    <label th:classappend="${@environment.getProperty('style.label_sm')}">아이콘</label>
                                    <div class="flex items-center gap-2">
                                        <!-- 현재 선택 아이콘 프리뷰 버튼 -->
                                        <button @click="showIconModal = true; iconSearchQuery = ''"
                                                class="flex items-center gap-2 px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 hover:border-blue-500 dark:hover:border-blue-400 transition-colors text-sm text-gray-700 dark:text-gray-200 min-w-0 flex-1"
                                                type="button">
                                            <span class="w-6 h-6 flex items-center justify-center rounded bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 shrink-0">
                                                <i :class="detail.icon ? `fas fa-${detail.icon}` : 'fas fa-question'"
                                                   class="text-xs"></i>
                                            </span>
                                            <span class="truncate text-xs"
                                                  x-text="detail.icon ? detail.icon : '아이콘 선택...'"></span>
                                            <i class="fas fa-chevron-down text-xs ml-auto text-gray-400"></i>
                                        </button>
                                        <!-- 아이콘 초기화 버튼 -->
                                        <button @click="detail.icon = ''" class="p-2 rounded-lg border border-gray-300 dark:border-gray-600 hover:border-red-400 hover:text-red-500 text-gray-400 transition-colors"
                                                type="button"
                                                x-show="detail.icon">
                                            <i class="fas fa-times text-xs"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- 상위 메뉴 (버그 수정: x-model + flatMenus 사용) -->
                                <div class="col-span-2 sm:col-span-1">
                                    <label for="parentMenu"
                                           th:classappend="${@environment.getProperty('style.label_sm')}">상위 메뉴</label>
                                    <select id="parentMenu"
                                            th:classappend="${@environment.getProperty('style.select_sm')}"
                                            x-model="detail.parentCode">
                                        <option value="">최상위 메뉴로 지정</option>
                                        <template :key="menu.code" x-for="menu in flatMenus">
                                            <option :disabled="menu.code === detail.code"
                                                    :value="menu.code"
                                                    x-text="menu.label"></option>
                                        </template>
                                    </select>
                                </div>

                                <!-- 접근 필요 권한 -->
                                <div class="col-span-2">
                                    <label th:classappend="${@environment.getProperty('style.label_sm')}">접근 필요
                                        권한</label>
                                    <div class="flex flex-wrap gap-3 mt-1">
                                        <template :key="role.code" x-for="role in roles">
                                            <label class="inline-flex items-center cursor-pointer">
                                                <input :checked="detail.roleCodes?.includes(role.code)"
                                                       @change="changeRole($event.target.checked, role.code)"
                                                       class="sr-only peer"
                                                       type="checkbox">
                                                <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
                                                <span class="ms-3 text-sm font-medium text-gray-900 dark:text-gray-300"
                                                      x-text="role.description"></span>
                                            </label>
                                        </template>
                                    </div>
                                </div>
                            </div>

                            <div class="flex justify-between pt-4 mt-6 border-t border-gray-200 dark:border-gray-700">
                                <div>
                                    <button @click="deleteMenu(detail.code)" id="btnDelete" th:classappend="${@environment.getProperty('style.button_error_sm')}"
                                            type="button"
                                            x-show="mode !== 'new'">
                                        삭제
                                    </button>
                                </div>
                                <div class="flex space-x-2">
                                    <button @click="detail = {}; mode = ''" th:classappend="${@environment.getProperty('style.button_alternative_sm')}"
                                            type="button">
                                        취소
                                    </button>
                                    <button @click="save(mode, detail)"
                                            th:classappend="${@environment.getProperty('style.button_sm')}"
                                            type="button"
                                            x-text="mode === 'new' ? '등록' : '수정'">
                                    </button>
                                </div>
                            </div>
                        </form>
                        <form class="hidden" id="deleteForm" method="post"></form>
                    </div>
                </div>
            </div>

            <!-- ============================================================ -->
            <!-- 아이콘 선택 모달                                              -->
            <!-- ============================================================ -->
            <div class="fixed inset-0 z-50 flex items-center justify-center p-4"
                 style="display: none;"
                 x-show="showIconModal"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-end="opacity-100"
                 x-transition:enter-start="opacity-0"
                 x-transition:leave="transition ease-in duration-150"
                 x-transition:leave-end="opacity-0"
                 x-transition:leave-start="opacity-100">
                <!-- 백드롭 -->
                <div @click="showIconModal = false" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>

                <!-- 모달 패널 -->
                <div class="relative z-10 bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 w-full max-w-2xl flex flex-col"
                     style="max-height: 80vh;"
                     x-transition:enter="transition ease-out duration-200"
                     x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                     x-transition:enter-start="opacity-0 scale-95 translate-y-4"
                     x-transition:leave="transition ease-in duration-150"
                     x-transition:leave-end="opacity-0 scale-95 translate-y-4"
                     x-transition:leave-start="opacity-100 scale-100 translate-y-0">
                    <!-- 모달 헤더 -->
                    <div class="flex items-center justify-between p-5 border-b border-gray-200 dark:border-gray-700 shrink-0">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center">
                                <i class="fas fa-icons text-white text-xs"></i>
                            </div>
                            <h3 class="text-base font-bold text-gray-900 dark:text-white">Font Awesome 아이콘 선택</h3>
                        </div>
                        <button @click="showIconModal = false" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors p-1"
                                type="button">
                            <i class="fas fa-times text-lg"></i>
                        </button>
                    </div>

                    <!-- 검색 바 -->
                    <div class="p-4 border-b border-gray-100 dark:border-gray-700 shrink-0">
                        <div class="relative">
                            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                            <input class="w-full pl-9 pr-4 py-2.5 text-sm border border-gray-300 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
                                   placeholder="아이콘 이름으로 검색 (예: user, chart, file...)"
                                   type="text"
                                   x-model="iconSearchQuery">
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-gray-400"
                                  x-show="iconSearchQuery"
                                  x-text="`${filteredIcons.length}개`"></span>
                        </div>
                    </div>

                    <!-- 아이콘 그리드 -->
                    <div class="overflow-y-auto flex-1 p-4">
                        <div class="flex flex-col items-center justify-center py-16 text-gray-400"
                             x-show="filteredIcons.length === 0">
                            <i class="fas fa-search text-3xl mb-3"></i>
                            <p class="text-sm">검색 결과가 없습니다.</p>
                        </div>
                        <div class="grid grid-cols-6 sm:grid-cols-8 gap-2">
                            <template :key="icon" x-for="icon in filteredIcons">
                                <button :class="detail.icon === icon
                                            ? 'border-blue-500 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 ring-2 ring-blue-500 ring-offset-1'
                                            : 'border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:border-blue-400 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/20'"
                                        :title="icon"
                                        @click="selectIcon(icon)"
                                        class="flex flex-col items-center justify-center p-2.5 rounded-xl border transition-all group aspect-square"
                                        type="button">
                                    <i :class="`fas fa-${icon}`"
                                       class="text-lg mb-1 transition-transform group-hover:scale-110"></i>
                                    <span class="text-[8px] leading-tight truncate w-full text-center opacity-60"
                                          x-text="icon"></span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <!-- 모달 푸터 -->
                    <div class="p-4 border-t border-gray-200 dark:border-gray-700 shrink-0 flex items-center justify-between">
                        <div class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400">
                            <template x-if="detail.icon">
                                <div class="flex items-center gap-2">
                                    <div class="w-7 h-7 rounded-lg bg-blue-50 dark:bg-blue-900/30 flex items-center justify-center">
                                        <i :class="`fas fa-${detail.icon}`" class="text-blue-500 text-sm"></i>
                                    </div>
                                    <span>선택됨: <strong class="text-gray-800 dark:text-gray-200"
                                                       x-text="detail.icon"></strong></span>
                                </div>
                            </template>
                            <span x-show="!detail.icon">아이콘을 클릭하여 선택하세요.</span>
                        </div>
                        <button @click="showIconModal = false" class="px-4 py-2 text-sm font-medium rounded-lg bg-blue-600 hover:bg-blue-700 text-white transition-colors"
                                type="button">
                            확인
                        </button>
                    </div>
                </div>
            </div>
        </div>

                function menuPageData() {
                    return {
                        detail: {},
                        mode: '',
                        menus: [],
                        roles: [],
                        flatMenus: [],
                        showIconModal: false,
                        iconSearchQuery: '',

                        get filteredIcons() {
                            const q = this.iconSearchQuery.toLowerCase().trim();
                            if (!q) return FA_FREE_ICONS;
                            return FA_FREE_ICONS.filter(icon => icon.includes(q));
                        },

                        selectIcon(icon) {
                            this.detail.icon = icon;
                            this.showIconModal = false;
                        },

                        openNew() {
                            this.detail = {code: '', roleCodes: [], parentCode: ''};
                            this.mode = 'new';
                        },

                        // 트리 구조의 메뉴를 DFS로 평탄화 (들여쓰기 시각화 포함)
                        flattenMenus(nodes, level = 0) {
                            let result = [];
                            for (const node of nodes) {
                                const prefix = '— '.repeat(level);
                                result.push({code: node.code, label: prefix + node.name});
                                if (node.children && node.children.length > 0) {
                                    result = result.concat(this.flattenMenus(node.children, level + 1));
                                }
                            }
                            return result;
                        },

                        changeRole(checked, code) {
                            if (!this.detail.roleCodes) this.detail.roleCodes = [];
                            if (checked) {
                                this.detail.roleCodes = [...new Set([code, ...this.detail.roleCodes])];
                            } else {
                                this.detail.roleCodes = this.detail.roleCodes.filter(item => item !== code);
                            }
                        },

                        async save(mode, detail) {
                            let response;
                            if (mode === 'new') {
                                response = await fetch('/api/admin/menus', {
                                    method: 'post',
                                    headers: {'content-type': 'application/json'},
                                    body: JSON.stringify(Alpine.raw(detail)),
                                });
                            } else {
                                response = await fetch(`/api/admin/menus/${detail.code}`, {
                                    method: 'put',
                                    headers: {'content-type': 'application/json'},
                                    body: JSON.stringify(Alpine.raw(detail)),
                                });
                            }
                            if (!response.ok) {
                                const msg = await response.text();
                                toast.error('저장 중 오류가 발생했습니다: ' + msg);
                                return;
                            }
                            Grids['adminMenuGrid'].Reload();
                            // 평탄화된 메뉴 목록도 갱신
                            const menuRes = await fetch('/api/admin/menus');
                            if (menuRes.ok) {
                                this.menus = await menuRes.json();
                                this.flatMenus = this.flattenMenus(this.menus);
                            }
                            toast.success('성공적으로 저장되었습니다.');
                        },

                        async deleteMenu(code) {
                            const self = this;
                            modal.show({
                                type: 'warn',
                                title: '데이터 삭제',
                                content: '정말 삭제하시겠습니까?\n삭제 후에는 복구할 수 없습니다.',
                                buttons: [
                                    {
                                        text: '삭제',
                                        color: 'red',
                                        onClick: async () => {
                                            const response = await fetch(`/api/admin/menus/${code}`, {method: 'delete'});
                                            if (!response.ok) {
                                                toast.error('삭제 중 오류가 발생했습니다.');
                                                return;
                                            }
                                            Grids['adminMenuGrid'].Reload();
                                            self.detail = {};
                                            self.mode = '';
                                            toast.success('성공적으로 삭제되었습니다.');
                                        }
                                    },
                                    {text: '취소', color: 'gray'}
                                ]
                            });
                        },

                        async init() {
                            // await 없이 json() 호출하는 버그 수정
                            const menuResponse = await fetch('/api/admin/menus');
                            const roleResponse = await fetch('/api/admin/roles');

                            if (!menuResponse.ok || !roleResponse.ok) {
                                toast.error('메뉴 또는 역할 데이터를 가져오는 중 오류가 발생했습니다.');
                                return;
                            }

                            this.menus = await menuResponse.json();
                            this.roles = await roleResponse.json();
                            // 트리를 평탄화하여 상위 메뉴 셀렉트박스에 바인딩
                            this.flatMenus = this.flattenMenus(this.menus);
                        }
                    };
                }

                // TreeGrid 행 클릭 이벤트 — Alpine 데이터에 반영
                TGSetEvent("OnClick", "adminMenuGrid", function (grid, row, col, x, y, event) {
                    if (!row || !row.code) return false;
                    fetch(`/api/admin/menus/${row.code}`)
                        .then(res => {
                            if (!res.ok) throw new Error('메뉴를 가져오는데 실패했습니다.');
                            return res.json();
                        })
                        .then(json => {
                            const el = document.getElementById('content');
                            const data = Alpine.$data(el);
                            data.detail = json;
                            data.mode = 'edit';
                        })
                        .catch(err => console.error(err));
                    return false;
                });
            </script>
