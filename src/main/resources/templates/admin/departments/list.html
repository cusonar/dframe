<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>부서 관리</title>
</head>
<body>
<nav class="flex" aria-label="Breadcrumb" layout:fragment="breadcrumb">
  <ol class="inline-flex" th:classappend="${@environment.getProperty('style.breadcrumb')}">
    <li class="inline-flex items-center"><a href="/" th:classappend="${@environment.getProperty('style.breadcrumb_item')}"><i class="fas fa-home mr-2"></i> Home</a></li>
    <li><div class="flex items-center"><i class="fas fa-chevron-right text-gray-400 mx-1 text-xs"></i><span class="ml-1" th:classappend="${@environment.getProperty('style.breadcrumb_item')}">시스템 관리</span></div></li>
    <li aria-current="page"><div class="flex items-center"><i class="fas fa-chevron-right text-gray-400 mx-1 text-xs"></i><span class="ml-1" th:classappend="${@environment.getProperty('style.tabs')}">부서 관리</span></div></li>
  </ol>
</nav>

<div layout:fragment="content" class="flex-1 overflow-hidden flex flex-col min-h-0 relative">
    <div class="flex-1 flex flex-col md:flex-row min-h-0 gap-4 p-4">
        
        <!-- 좌측: 부서 트리 (1/3) -->
        <div class="w-full md:w-1/3 shadow-md flex flex-col min-h-0" th:classappend="${@environment.getProperty('style.card')}">
            <div class="p-3 justify-between items-center shrink-0" th:classappend="${@environment.getProperty('style.tabs')}">
                <h3 class="text-md font-semibold text-gray-900 dark:text-white">조직도</h3>
                <button type="button" onclick="prepareCreate()" class="text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-xs px-3 py-1.5">
                    <i class="fas fa-plus mr-1"></i> 부서 추가
                </button>
            </div>
            <div class="p-3 border-b border-gray-200 dark:border-gray-700 shrink-0">
                <input type="text" id="treeFilter" onkeyup="filterTree()" placeholder="부서명 검색..." class="p-2" th:classappend="${@environment.getProperty('style.input')}">
            </div>
            <div class="p-0 overflow-hidden flex-1" id="deptTreeGrid">
            </div>
        </div>

        <!-- 우측: 부서 상세 (2/3) -->
        <div class="w-full md:w-2/3 shadow-md flex flex-col min-h-0" th:classappend="${@environment.getProperty('style.card')}">
            <div class="p-3 border-b border-gray-200 dark:border-gray-700 shrink-0">
                <h3 id="detailPanelTitle" class="text-md font-semibold text-gray-900 dark:text-white">부서 상세 정보</h3>
            </div>
            <div class="p-6 overflow-y-auto flex-1 relative">
                <div id="emptySelectionMsg" class="absolute inset-0 flex-col z-10" th:classappend="${@environment.getProperty('style.pagination_item')}">
                    <i class="fas fa-sitemap text-4xl mb-3 text-gray-300 dark:text-gray-600"></i>
                    <p>좌측 조직도에서 부서를 선택하거나 새 부서를 추가하세요.</p>
                </div>
                
                <form id="departmentForm" action="/admin/departments" method="post">
                    <div class="grid gap-4 mb-4 grid-cols-2">
                        <div class="col-span-2">
                            <label for="deptName" th:classappend="${@environment.getProperty('style.label')}">부서명 <span class="text-red-500">*</span></label>
                            <input type="text" name="name" id="deptName" class="focus:ring-blue-600 focus:border-blue-600" th:classappend="${@environment.getProperty('style.input')}" required>
                        </div>
                        <div class="col-span-2">
                            <label for="deptEngName" th:classappend="${@environment.getProperty('style.label')}">부서 영문명</label>
                            <input type="text" name="englishName" id="deptEngName" class="focus:ring-blue-600 focus:border-blue-600" th:classappend="${@environment.getProperty('style.input')}">
                        </div>
                        <div class="col-span-2">
                            <label for="parentDept" th:classappend="${@environment.getProperty('style.label')}">상위 부서</label>
                            <select id="parentDept" name="parentId" th:classappend="${@environment.getProperty('style.input')}">
                                <option value="">최상위 부서로 지정 (없음)</option>
                                <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="flex justify-between pt-4 mt-6 border-t border-gray-200 dark:border-gray-700">
                        <div>
                            <button type="button" id="btnDelete" onclick="deleteDept()" class="hidden bg-red-600 hover:bg-red-700 focus:ring-red-300" th:classappend="${@environment.getProperty('style.button')}">삭제</button>
                        </div>
                        <div class="flex space-x-2">
                            <button type="button" onclick="cancelSelection()" th:classappend="${@environment.getProperty('style.button_alternative')}">취소</button>
                            <button type="submit" id="btnSave" th:classappend="${@environment.getProperty('style.button')}">등록</button>
                        </div>
                    </div>
                </form>
                <form id="deleteForm" method="post" class="hidden"></form>
            </div>
        </div>
    </div>


</div>

<th:block layout:fragment="script">
<script th:inline="javascript">
    const deptLayout = {
        Cfg: { id: "DeptGrid", MainCol: "Name", ConstHeight: 1, ConstWidth: 1, Dragging: 0, Selecting: 0, Sorting: 0 },
        Panel: { Visible: 0 },
        Header: { Visible: 0 },
        Cols: [ { Name: "Name", Type: "Text", RelWidth: 1, CanEdit: 0 } ]
    };

    const deptDataJSON = [
        <th:block th:fragment="deptTreeJS(deptList)">
            <th:block th:each="dept, iterStat : ${deptList}">
                {
                    id: [[${dept.id}]],
                    Name: [[${dept.name}]],
                    EngName: [[${dept.englishName}]],
                    ParentId: [[${dept.parent?.id ?: ''}]],
                    Expanded: 1,
                    Items: [
                        <th:block th:if="${not #lists.isEmpty(dept.children)}">
                            <th:block th:replace="~{admin/departments/list :: deptTreeJS(${dept.children})}"></th:block>
                        </th:block>
                    ]
                }<th:block th:if="${!iterStat.last}">,</th:block>
            </th:block>
        </th:block>
    ];

    document.addEventListener("DOMContentLoaded", function() {
        const tgData = {
            Layout: deptLayout,
            Data: { Body: [ deptDataJSON ] }
        };
        TreeGrid(tgData, "deptTreeGrid");
    });

    TGSetEvent("OnClick", "DeptGrid", function(grid, row, col, x, y, event) {
        if(row.Kind === "Data") {
            showDeptDetailsFromGrid(row);
        }
    });

    let currentMode = ''; 
    let currentId = null;

    function prepareCreate() {
        currentMode = 'create';
        currentId = null;
        
        document.getElementById('emptySelectionMsg').style.display = 'none';
        document.getElementById('detailPanelTitle').textContent = '새 부서 등록';
        document.getElementById('departmentForm').action = '/admin/departments';
        
        document.getElementById('deptName').value = '';
        document.getElementById('deptEngName').value = '';
        document.getElementById('parentDept').value = '';
        
        document.getElementById('btnDelete').classList.add('hidden');
        document.getElementById('btnSave').textContent = '등록';
        
        // highlightTreeNode(null); // TreeGrid handles selection styling if needed, or we just focus it
        const grid = Grids["DeptGrid"];
        if(grid) {
            grid.SelectAllRows(0); // clear selection
        }
    }

    function showDeptDetailsFromGrid(row) {
        currentMode = 'edit';
        currentId = row.id;
        const name = row.Name;
        const engName = row.EngName;
        const parentId = row.ParentId;
        
        document.getElementById('emptySelectionMsg').style.display = 'none';
        document.getElementById('detailPanelTitle').textContent = '부서 정보 수정';
        document.getElementById('departmentForm').action = '/admin/departments/' + currentId;
        
        document.getElementById('deptName').value = name || '';
        document.getElementById('deptEngName').value = engName || '';
        document.getElementById('parentDept').value = parentId || '';
        
        document.getElementById('btnDelete').classList.remove('hidden');
        document.getElementById('btnSave').textContent = '저장';
    }

    function cancelSelection() {
        document.getElementById('emptySelectionMsg').style.display = 'flex';
        document.getElementById('departmentForm').reset();
        const grid = Grids["DeptGrid"];
        if(grid) {
            grid.SelectAllRows(0);
        }
    }

    function deleteDept() {
        if (!currentId) return;
        if (confirm('이 부서를 정말 삭제하시겠습니까? 하위 부서가 있을 경우 함께 처리될 수 있습니다.')) {
            const deleteForm = document.getElementById('deleteForm');
            deleteForm.action = '/admin/departments/' + currentId + '/delete';
            deleteForm.submit();
        }
    }

    function filterTree() {
        const query = document.getElementById('treeFilter').value.toLowerCase();
        const grid = Grids["DeptGrid"];
        if (grid) {
            if(query) {
                grid.FilterTextRange(query, "Name", 1);
            } else {
                grid.FilterTextRange("", "Name", 1);
            }
        }
    }
</script>
</th:block>
</body>
</html>
