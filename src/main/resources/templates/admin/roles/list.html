<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>역할 및 권한 관리</title>
</head>
<body>
<nav class="flex" aria-label="Breadcrumb" layout:fragment="breadcrumb">
  <ol class="inline-flex" th:classappend="${@environment.getProperty('style.breadcrumb')}">
    <li class="inline-flex items-center"><a href="/" th:classappend="${@environment.getProperty('style.breadcrumb_item')}"><i class="fas fa-home mr-2"></i> Home</a></li>
    <li><div class="flex items-center"><i class="fas fa-chevron-right text-gray-400 mx-1 text-xs"></i><span class="ml-1" th:classappend="${@environment.getProperty('style.breadcrumb_item')}">시스템 관리</span></div></li>
    <li aria-current="page"><div class="flex items-center"><i class="fas fa-chevron-right text-gray-400 mx-1 text-xs"></i><span class="ml-1" th:classappend="${@environment.getProperty('style.tabs')}">역할 및 권한 관리</span></div></li>
  </ol>
</nav>

<div layout:fragment="content" class="flex-1 overflow-hidden flex flex-col min-h-0">
    <div class="bg-white dark:bg-gray-800 relative shadow-md sm:rounded-lg flex-1 flex flex-col min-h-0">
        <!-- 툴바 영역 (고정) -->
        <div class="flex-col md:flex-row items-center space-y-2 md:space-y-0 py-2 px-4 dark:border-gray-700 shrink-0" th:classappend="${@environment.getProperty('style.modal_header')}">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white">역할 목록</h3>
            <button type="button" data-modal-target="createRoleModal" data-modal-toggle="createRoleModal" class="flex items-center justify-center px-4 py-2" th:classappend="${@environment.getProperty('style.button')}">
                <i class="fas fa-plus mr-2"></i> 역할 추가
            </button>
        </div>
        
        <!-- 테이블 영역 (스크롤) -->
        <div class="overflow-x-auto overflow-y-auto flex-1 min-h-0">
            <table class="relative" th:classappend="${@environment.getProperty('style.table')}">
                <thead class="sticky top-0 z-10 shadow-sm" th:classappend="${@environment.getProperty('style.table_head')}">
                    <tr>
                        <th scope="col" class="px-4 py-2">ID</th>
                        <th scope="col" class="px-4 py-2">역할명</th>
                        <th scope="col" class="px-4 py-2">설명</th>
                        <th scope="col" class="px-4 py-2">매핑된 세부 권한</th>
                        <th scope="col" class="px-4 py-2 text-center">관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="role : ${roles}" class="hover:bg-gray-100" th:classappend="${@environment.getProperty('style.table_row')}">
                        <td class="px-4 py-2" th:text="${role.id}">1</td>
                        <td class="px-4 py-2 font-bold text-gray-900 dark:text-white" th:text="${role.name}">ROLE_ADMIN</td>
                        <td class="px-4 py-2" th:text="${role.description}">관리자</td>
                        <td class="px-4 py-2">
                            <span th:each="auth : ${role.authorities}" th:text="${auth.name}" class="mr-2" th:classappend="${@environment.getProperty('style.badge_indigo')}">READ_USER</span>
                        </td>
                        <td class="px-4 py-2 text-center">
                            <button class="text-blue-600 hover:text-blue-800 font-medium"><i class="fas fa-edit"></i> 수정</button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(roles)}">
                        <td colspan="5" class="px-4 py-8 text-center text-gray-500">등록된 역할이 없습니다.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

<!-- Role Create Modal -->
<div id="createRoleModal" tabindex="-1" aria-hidden="true" class="justify-center items-center" th:classappend="${@environment.getProperty('style.modal_overlay')}">
    <div class="relative p-4 w-full max-w-lg max-h-full">
        <div th:classappend="${@environment.getProperty('style.modal_content')}">
            <div class="items-center" th:classappend="${@environment.getProperty('style.modal_header')}">
                <h3 class="text-lg font-semibold text-gray-900 dark:text-white">새 역할 등록</h3>
                <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg w-8 h-8 ms-auto justify-center dark:hover:bg-gray-600" th:classappend="${@environment.getProperty('style.breadcrumb_item')}" data-modal-toggle="createRoleModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form action="/admin/roles" method="post" class="p-4">
                <div class="grid gap-4 mb-4 grid-cols-1">
                    <div>
                        <label for="roleName" th:classappend="${@environment.getProperty('style.label')}">역할명 (예: ROLE_USER)</label>
                        <input type="text" name="name" id="roleName" class="focus:ring-blue-600 focus:border-blue-600 dark:bg-gray-600 dark:border-gray-500" th:classappend="${@environment.getProperty('style.input')}" required>
                    </div>
                    <div>
                        <label for="roleDesc" th:classappend="${@environment.getProperty('style.label')}">설명</label>
                        <input type="text" name="description" id="roleDesc" class="focus:ring-blue-600 focus:border-blue-600 dark:bg-gray-600 dark:border-gray-500" th:classappend="${@environment.getProperty('style.input')}" required>
                    </div>
                    <div>
                        <label th:classappend="${@environment.getProperty('style.label')}">매핑할 세부 권한</label>
                        <div class="flex flex-wrap gap-4 max-h-40 p-2 rounded border border-gray-200 dark:border-gray-600" th:classappend="${@environment.getProperty('style.sidebar_inner')}">
                            <div class="flex items-center w-full sm:w-auto" th:each="auth : ${authorities}">
                                <input th:id="'auth-' + ${auth.id}" type="checkbox" name="authorityIds" th:value="${auth.id}" th:classappend="${@environment.getProperty('style.checkbox')}">
                                <label th:for="'auth-' + ${auth.id}" class="ms-2 dark:text-gray-300" th:classappend="${@environment.getProperty('style.label')}" th:text="${auth.name}">READ_USER</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex justify-end pt-4 border-t dark:border-gray-600">
                    <button type="button" data-modal-toggle="createRoleModal" class="me-2" th:classappend="${@environment.getProperty('style.button_alternative')}">취소</button>
                    <button type="submit" class="inline-flex items-center text-center" th:classappend="${@environment.getProperty('style.button')}">등록</button>
                </div>
            </form>
        </div>
    </div>
</div>
</div>
</body>
</html>
