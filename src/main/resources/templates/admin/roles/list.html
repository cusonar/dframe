<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>역할 및 권한 관리</title>
</head>
<body>
<nav class="flex" aria-label="Breadcrumb" layout:fragment="breadcrumb">
  <ol class="inline-flex items-center space-x-1 md:space-x-2 rtl:space-x-reverse">
    <li class="inline-flex items-center"><a href="/" class="text-sm font-medium text-gray-700 hover:text-blue-600 dark:text-gray-400 dark:hover:text-white"><i class="fas fa-home mr-2"></i> Home</a></li>
    <li><div class="flex items-center"><i class="fas fa-chevron-right text-gray-400 mx-1 text-xs"></i><span class="text-sm font-medium text-gray-700 dark:text-gray-400 ml-1">시스템 관리</span></div></li>
    <li aria-current="page"><div class="flex items-center"><i class="fas fa-chevron-right text-gray-400 mx-1 text-xs"></i><span class="text-sm font-medium text-gray-500 dark:text-gray-400 ml-1">역할 및 권한 관리</span></div></li>
  </ol>
</nav>

<div layout:fragment="content" class="flex-1 overflow-hidden flex flex-col min-h-0">
    <div class="bg-white dark:bg-gray-800 relative shadow-md sm:rounded-lg flex-1 flex flex-col min-h-0">
        <!-- 툴바 영역 (고정) -->
        <div class="flex flex-col md:flex-row items-center justify-between space-y-2 md:space-y-0 py-2 px-4 border-b dark:border-gray-700 shrink-0">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white">역할 목록</h3>
            <button type="button" data-modal-target="createRoleModal" data-modal-toggle="createRoleModal" class="flex items-center justify-center text-white bg-blue-700 hover:bg-blue-800 font-medium rounded-lg text-sm px-4 py-2">
                <i class="fas fa-plus mr-2"></i> 역할 추가
            </button>
        </div>
        
        <!-- 테이블 영역 (스크롤) -->
        <div class="overflow-x-auto overflow-y-auto flex-1 min-h-0">
            <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400 relative">
                <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400 sticky top-0 z-10 shadow-sm">
                    <tr>
                        <th scope="col" class="px-4 py-2">ID</th>
                        <th scope="col" class="px-4 py-2">역할명</th>
                        <th scope="col" class="px-4 py-2">설명</th>
                        <th scope="col" class="px-4 py-2">매핑된 세부 권한</th>
                        <th scope="col" class="px-4 py-2 text-center">관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="role : ${roles}" class="border-b dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600">
                        <td class="px-4 py-2" th:text="${role.id}">1</td>
                        <td class="px-4 py-2 font-bold text-gray-900 dark:text-white" th:text="${role.name}">ROLE_ADMIN</td>
                        <td class="px-4 py-2" th:text="${role.description}">관리자</td>
                        <td class="px-4 py-2">
                            <span th:each="auth : ${role.authorities}" th:text="${auth.name}" class="bg-indigo-100 text-indigo-800 text-xs font-medium mr-2 px-2.5 py-0.5 rounded dark:bg-indigo-900 dark:text-indigo-300">READ_USER</span>
                        </td>
                        <td class="px-4 py-2 text-center">
                            <button class="text-blue-600 hover:text-blue-800 font-medium"><i class="fas fa-edit"></i> 수정</button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(roles)}">
                        <td colspan="5" class="px-4 py-8 text-center text-gray-500">등록된 역할이 없습니다.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

<!-- Role Create Modal -->
<div id="createRoleModal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
    <div class="relative p-4 w-full max-w-lg max-h-full">
        <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
            <div class="flex items-center justify-between p-4 border-b rounded-t dark:border-gray-600">
                <h3 class="text-lg font-semibold text-gray-900 dark:text-white">새 역할 등록</h3>
                <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-toggle="createRoleModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form action="/admin/roles" method="post" class="p-4">
                <div class="grid gap-4 mb-4 grid-cols-1">
                    <div>
                        <label for="roleName" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">역할명 (예: ROLE_USER)</label>
                        <input type="text" name="name" id="roleName" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white" required>
                    </div>
                    <div>
                        <label for="roleDesc" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">설명</label>
                        <input type="text" name="description" id="roleDesc" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white" required>
                    </div>
                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">매핑할 세부 권한</label>
                        <div class="flex flex-wrap gap-4 max-h-40 overflow-y-auto p-2 bg-gray-50 dark:bg-gray-800 rounded border border-gray-200 dark:border-gray-600">
                            <div class="flex items-center w-full sm:w-auto" th:each="auth : ${authorities}">
                                <input th:id="'auth-' + ${auth.id}" type="checkbox" name="authorityIds" th:value="${auth.id}" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:bg-gray-700 dark:border-gray-600">
                                <label th:for="'auth-' + ${auth.id}" class="ms-2 text-sm font-medium text-gray-900 dark:text-gray-300" th:text="${auth.name}">READ_USER</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex justify-end pt-4 border-t dark:border-gray-600">
                    <button type="button" data-modal-toggle="createRoleModal" class="py-2.5 px-5 me-2 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-blue-700 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700">취소</button>
                    <button type="submit" class="text-white inline-flex items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">등록</button>
                </div>
            </form>
        </div>
    </div>
</div>
</div>
</body>
</html>
