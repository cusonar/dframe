<!DOCTYPE html>
<html xmlns:th="thymeleaf.org">
<head></head>
<body>

<div th:fragment="node(id, name, isFolder, hasChildren)">

    <!-- Alpine.js로 노드별 토글 상태 관리 (초기값: 닫힘) -->
    <li class="pl-2" th:x-data="|{ open: false, loaded: false }|">
        <div class="flex items-center justify-between p-2 rounded-lg hover:bg-gray-100 transition-colors duration-150 cursor-pointer">

            <!-- 폴더 노드인 경우 -->
            <div class="space-x-3 w-full font-medium text-gray-800" th:classappend="${@environment.getProperty('style.pagination')}"
                 th:if="${isFolder}"
                 th:x-on:click="open = !open; if(open && !loaded) { loaded = true; htmx.trigger($el, 'load-children'); }">
                <!-- Alpine: 클릭 시 열림 전환 및 HTMX가 한 번만 요청하도록 제어 -->

                <!-- 토글 화살표 아이콘 회전 애니메이션 -->
                <i class="fas fa-chevron-right text-gray-400 text-xs transition-transform duration-200"
                   th:x-bind:class="open ? 'rotate-90' : ''"></i>

                <!-- 폴더 상태별 아이콘 스위칭 -->
                <i class="text-yellow-400 text-base"
                   th:x-bind:class="open ? 'fas fa-folder-open' : 'fas fa-folder'"></i>

                <span th:text="${name}">폴더명</span>

                <!-- ⚡ HTMX 비동기 지연 로딩 트리거 영역 -->
                <!-- x-on:click에서 수동으로 'load-children' 이벤트를 날릴 때만 동작합니다 -->
                <div hx-swap="innerHTML"
                     hx-trigger="load-children"
                     th:hx-get="|/api/tree/children?parentId=${id}|"
                     th:hx-target="|#children-${id}|"
                     th:if="${hasChildren}">
                </div>
            </div>

            <!-- 일반 파일/최하위 리프 노드인 경우 -->
            <div class="space-x-3 pl-5 w-full text-gray-600" th:classappend="${@environment.getProperty('style.pagination')}" th:if="${!isFolder}">
                <i class="fas fa-file text-gray-400 text-base"></i>
                <span th:text="${name}">파일명</span>
            </div>
        </div>

        <!-- 하위 자식 노드들이 삽입될 컨테이너 박스 -->
        <!-- Alpine.js의 x-show와 x-collapse(슬라이드 효과)로 부드럽게 열고 닫힙니다 -->
        <ul class="pl-4 border-l border-gray-200 ml-4 mt-1 space-y-1"
            th:id="|children-${id}|"
            th:if="${isFolder && hasChildren}"
            x-show="open"
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 transform -translate-y-2">

            <!-- 최초 로딩 전 보여줄 스켈레톤/로딩바 -->
            <li class="text-xs text-gray-400 py-1 pl-2" x-show="!loaded">
                <i class="fas fa-spinner fa-spin mr-1"></i> 로딩 중...
            </li>
        </ul>
    </li>

</div>

</body>
</html>
