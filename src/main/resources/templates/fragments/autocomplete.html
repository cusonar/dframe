<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <!--
        ╔══════════════════════════════════════════════════════════════╗
        ║  Autocomplete 컴포넌트                                       ║
        ║                                                              ║
        ║  사용법 (Thymeleaf fragment):                                 ║
        ║  <th:block th:replace="~{fragments/autocomplete ::           ║
        ║      autocomplete(                                           ║
        ║          id        = 'employee-search',                      ║
        ║          url       = '/api/employees/search',                ║
        ║          labelField= 'name',                                 ║
        ║          valueField= 'id',                                   ║
        ║          placeholder='직원 이름을 검색하세요...',                ║
        ║          minChars  = '2',                                    ║
        ║          eventName = 'employee-selected'                     ║
        ║      )}">                                                    ║
        ║  </th:block>                                                 ║
        ║                                                              ║
        ║  파라미터:                                                    ║
        ║  - id          : 고유 식별자 (필수)                            ║
        ║  - url         : 검색 API 엔드포인트 (필수)                     ║
        ║                  쿼리스트링 ?q={검색어} 로 요청                  ║
        ║  - labelField  : 표시할 필드명 (기본: 'label')                 ║
        ║  - valueField  : 값으로 사용할 필드명 (기본: 'value')           ║
        ║  - placeholder : 입력 필드 플레이스홀더                        ║
        ║  - minChars    : 검색 시작 최소 글자수 (기본: 1)               ║
        ║  - eventName   : 항목 선택 시 dispatch할 이벤트명              ║
        ║                  (기본: 'autocomplete-selected')              ║
        ║  - subLabelField: 보조 텍스트 필드명 (선택, 예: 'department')   ║
        ║  - maxResults  : 최대 표시 결과 수 (기본: 10)                  ║
        ║  - items       : 정적 데이터 배열 (url 대신 사용, JSON 문자열)  ║
        ║                                                              ║
        ║  이벤트:                                                      ║
        ║  - autocomplete-selected (또는 eventName):                    ║
        ║    detail = { id, value, label, item }                       ║
        ╚══════════════════════════════════════════════════════════════╝
    -->

    <th:block th:fragment="autocomplete (id, url, labelField, valueField, placeholder, minChars, eventName, subLabelField, maxResults, items)">
        <div class="df-autocomplete-wrapper"
             th:id="${id}"
             th:data-url="${url}"
             th:data-label-field="${labelField ?: 'label'}"
             th:data-value-field="${valueField ?: 'value'}"
             th:data-placeholder="${placeholder ?: '검색어를 입력하세요...'}"
             th:data-min-chars="${minChars ?: '1'}"
             th:data-event-name="${eventName ?: 'autocomplete-selected'}"
             th:data-sub-label-field="${subLabelField ?: ''}"
             th:data-max-results="${maxResults ?: '10'}"
             th:data-items="${items ?: ''}"
             x-data="dfAutocomplete($el)"
             @click.away="close()">

            <!-- ── Autocomplete 전용 CSS ── -->
            <style>
                .df-autocomplete-wrapper {
                    position: relative;
                    width: 100%;
                }

                /* ── 입력 필드 컨테이너 ── */
                .df-ac-input-wrap {
                    position: relative;
                    display: flex;
                    align-items: center;
                }

                .df-ac-input {
                    width: 100%;
                    height: 40px;
                    padding: 0 36px 0 38px;
                    border-radius: 10px;
                    border: 1.5px solid #d1d5db;
                    background: #fff;
                    font-size: 13px;
                    color: #374151;
                    outline: none;
                    transition: border-color 0.2s, box-shadow 0.2s;
                    box-sizing: border-box;
                }
                .dark .df-ac-input {
                    background: #1f2937;
                    border-color: #374151;
                    color: #e5e7eb;
                }
                .df-ac-input:focus {
                    border-color: #3b82f6;
                    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
                }
                .df-ac-input::placeholder {
                    color: #9ca3af;
                    font-size: 12.5px;
                }
                .df-ac-input.has-value {
                    border-color: #3b82f6;
                    background: #f0f7ff;
                }
                .dark .df-ac-input.has-value {
                    background: #172554;
                    border-color: #2563eb;
                }

                /* 왼쪽 검색 아이콘 */
                .df-ac-icon-left {
                    position: absolute;
                    left: 12px;
                    top: 50%;
                    transform: translateY(-50%);
                    font-size: 13px;
                    color: #9ca3af;
                    pointer-events: none;
                    transition: color 0.2s;
                }
                .df-ac-input-wrap:focus-within .df-ac-icon-left {
                    color: #3b82f6;
                }

                /* 오른쪽 클리어/스피너 버튼 */
                .df-ac-icon-right {
                    position: absolute;
                    right: 10px;
                    top: 50%;
                    transform: translateY(-50%);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    width: 22px;
                    height: 22px;
                    border-radius: 50%;
                    border: none;
                    cursor: pointer;
                    font-size: 10px;
                    transition: background 0.15s, color 0.15s, transform 0.15s;
                    background: transparent;
                    color: #9ca3af;
                    padding: 0;
                }
                .df-ac-icon-right:hover {
                    background: #fee2e2;
                    color: #dc2626;
                }
                .dark .df-ac-icon-right:hover {
                    background: #7f1d1d;
                    color: #fca5a5;
                }

                /* 로딩 스피너 */
                .df-ac-spinner {
                    position: absolute;
                    right: 12px;
                    top: 50%;
                    transform: translateY(-50%);
                    width: 16px;
                    height: 16px;
                    border: 2px solid #e5e7eb;
                    border-top-color: #3b82f6;
                    border-radius: 50%;
                    animation: dfAcSpin 0.6s linear infinite;
                    pointer-events: none;
                }
                @keyframes dfAcSpin {
                    to { transform: translateY(-50%) rotate(360deg); }
                }

                /* ── 드롭다운 패널 ── */
                .df-ac-dropdown {
                    position: absolute;
                    top: calc(100% + 6px);
                    left: 0;
                    right: 0;
                    background: #fff;
                    border: 1.5px solid #e5e7eb;
                    border-radius: 12px;
                    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.06);
                    z-index: 9999;
                    overflow: hidden;
                    animation: dfAcDropIn 0.15s ease;
                }
                .dark .df-ac-dropdown {
                    background: #1f2937;
                    border-color: #374151;
                    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
                }
                @keyframes dfAcDropIn {
                    from { opacity: 0; transform: translateY(-6px); }
                    to   { opacity: 1; transform: translateY(0); }
                }

                /* 드롭다운 목록 */
                .df-ac-list {
                    max-height: 260px;
                    overflow-y: auto;
                    padding: 6px 0;
                }
                .df-ac-list::-webkit-scrollbar { width: 4px; }
                .df-ac-list::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
                .dark .df-ac-list::-webkit-scrollbar-thumb { background: #4b5563; }

                /* 드롭다운 아이템 */
                .df-ac-item {
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    padding: 10px 14px;
                    font-size: 13px;
                    color: #374151;
                    cursor: pointer;
                    transition: background 0.1s;
                    border: none;
                    background: transparent;
                    width: 100%;
                    text-align: left;
                }
                .df-ac-item:hover,
                .df-ac-item.highlighted {
                    background: #eff6ff;
                    color: #1d4ed8;
                }
                .dark .df-ac-item {
                    color: #d1d5db;
                }
                .dark .df-ac-item:hover,
                .dark .df-ac-item.highlighted {
                    background: #1e3554;
                    color: #93c5fd;
                }

                /* 아이템 아이콘 */
                .df-ac-item-icon {
                    width: 32px;
                    height: 32px;
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    border-radius: 8px;
                    font-size: 12px;
                    flex-shrink: 0;
                    background: linear-gradient(135deg, #eff6ff, #dbeafe);
                    color: #2563eb;
                }
                .dark .df-ac-item-icon {
                    background: linear-gradient(135deg, #1e3554, #1e3a8a40);
                    color: #60a5fa;
                }

                /* 아이템 텍스트 영역 */
                .df-ac-item-text {
                    display: flex;
                    flex-direction: column;
                    gap: 1px;
                    min-width: 0;
                }
                .df-ac-item-label {
                    font-weight: 500;
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                }
                .df-ac-item-sub {
                    font-size: 11px;
                    color: #9ca3af;
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                }
                .dark .df-ac-item-sub {
                    color: #6b7280;
                }

                /* 텍스트 하이라이트 */
                .df-ac-highlight {
                    background: #fef08a;
                    color: #92400e;
                    border-radius: 2px;
                    padding: 0 1px;
                }
                .dark .df-ac-highlight {
                    background: #854d0e;
                    color: #fef08a;
                }

                /* 결과 없음 */
                .df-ac-empty {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    gap: 6px;
                    padding: 24px 14px;
                    color: #9ca3af;
                    font-size: 12.5px;
                }
                .df-ac-empty i {
                    font-size: 20px;
                    color: #d1d5db;
                }
                .dark .df-ac-empty i {
                    color: #4b5563;
                }

                /* 선택된 값 표시 칩 */
                .df-ac-selected-chip {
                    display: inline-flex;
                    align-items: center;
                    gap: 6px;
                    padding: 3px 10px 3px 12px;
                    border-radius: 999px;
                    font-size: 12px;
                    font-weight: 500;
                    background: linear-gradient(135deg, #eff6ff, #dbeafe);
                    color: #1d4ed8;
                    border: 1px solid #bfdbfe;
                    white-space: nowrap;
                    animation: dfAcChipPop 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
                }
                .dark .df-ac-selected-chip {
                    background: linear-gradient(135deg, #1e3554, #1e3a8a40);
                    color: #93c5fd;
                    border-color: #1e40af;
                }
                @keyframes dfAcChipPop {
                    from { transform: scale(0.6); opacity: 0; }
                    to   { transform: scale(1); opacity: 1; }
                }
                .df-ac-selected-chip button {
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    width: 16px;
                    height: 16px;
                    border-radius: 50%;
                    background: #bfdbfe;
                    color: #1d4ed8;
                    border: none;
                    cursor: pointer;
                    font-size: 8px;
                    padding: 0;
                    transition: background 0.12s;
                }
                .df-ac-selected-chip button:hover {
                    background: #3b82f6;
                    color: #fff;
                }
                .dark .df-ac-selected-chip button {
                    background: #1e40af;
                    color: #93c5fd;
                }
                .dark .df-ac-selected-chip button:hover {
                    background: #2563eb;
                    color: #fff;
                }

                /* 드롭다운 하단 힌트 */
                .df-ac-hint {
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    padding: 8px 14px;
                    border-top: 1px solid #f3f4f6;
                    font-size: 10.5px;
                    color: #9ca3af;
                }
                .dark .df-ac-hint {
                    border-color: #374151;
                }
                .df-ac-hint kbd {
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    min-width: 18px;
                    height: 18px;
                    padding: 0 4px;
                    border-radius: 4px;
                    background: #f3f4f6;
                    border: 1px solid #e5e7eb;
                    font-size: 10px;
                    font-family: inherit;
                    color: #6b7280;
                }
                .dark .df-ac-hint kbd {
                    background: #374151;
                    border-color: #4b5563;
                    color: #9ca3af;
                }
            </style>

            <!-- ── 선택된 값이 있을 때: 칩 표시 ── -->
            <template x-if="selectedItem">
                <div class="df-ac-input-wrap">
                    <span class="df-ac-icon-left"><i class="fas fa-check-circle" style="color: #22c55e;"></i></span>
                    <div class="df-ac-input has-value" style="display:flex; align-items:center; padding-left:38px; cursor:pointer;"
                         @click="clearAndFocus()">
                        <span class="df-ac-selected-chip">
                            <span x-text="selectedItem[labelField]"></span>
                            <button type="button" @click.stop="clearSelection()" title="선택 해제">
                                <i class="fas fa-times"></i>
                            </button>
                        </span>
                    </div>
                </div>
            </template>

            <!-- ── 선택 전: 입력 필드 ── -->
            <template x-if="!selectedItem">
                <div class="df-ac-input-wrap">
                    <span class="df-ac-icon-left"><i class="fas fa-search"></i></span>
                    <input class="df-ac-input"
                           type="text"
                           x-ref="input"
                           x-model="query"
                           :placeholder="placeholder"
                           @focus="onFocus()"
                           @input="onInput()"
                           @keydown.escape="close()"
                           @keydown.enter.prevent="selectHighlighted()"
                           @keydown.down.prevent="navigate(1)"
                           @keydown.up.prevent="navigate(-1)"
                           @keydown.tab="close()"
                           autocomplete="off"
                           spellcheck="false">

                    <!-- 로딩 스피너 -->
                    <template x-if="loading">
                        <span class="df-ac-spinner"></span>
                    </template>

                    <!-- 클리어 버튼 -->
                    <template x-if="!loading && query.length > 0">
                        <button class="df-ac-icon-right" type="button" @click="clearQuery()" title="지우기">
                            <i class="fas fa-times"></i>
                        </button>
                    </template>
                </div>
            </template>

            <!-- ── 드롭다운 ── -->
            <div class="df-ac-dropdown" x-show="isOpen && !selectedItem" x-cloak @click.stop>

                <!-- 결과 목록 -->
                <template x-if="results.length > 0">
                    <div>
                        <div class="df-ac-list" x-ref="list">
                            <template x-for="(item, idx) in results" :key="idx">
                                <button class="df-ac-item"
                                        :class="{ highlighted: highlightedIndex === idx }"
                                        :data-idx="idx"
                                        @mouseenter="highlightedIndex = idx"
                                        @click.stop="selectItem(item)">
                                    <span class="df-ac-item-icon">
                                        <i class="fas fa-cube"></i>
                                    </span>
                                    <span class="df-ac-item-text">
                                        <span class="df-ac-item-label" x-html="highlightMatch(item[labelField])"></span>
                                        <template x-if="subLabelField && item[subLabelField]">
                                            <span class="df-ac-item-sub" x-text="item[subLabelField]"></span>
                                        </template>
                                    </span>
                                </button>
                            </template>
                        </div>
                        <div class="df-ac-hint">
                            <kbd>↑↓</kbd> 이동 &nbsp;
                            <kbd>Enter</kbd> 선택 &nbsp;
                            <kbd>Esc</kbd> 닫기
                        </div>
                    </div>
                </template>

                <!-- 결과 없음 -->
                <template x-if="results.length === 0 && !loading && query.length >= minChars">
                    <div class="df-ac-empty">
                        <i class="fas fa-search-minus"></i>
                        <span>검색 결과가 없습니다</span>
                    </div>
                </template>

                <!-- 최소 글자수 안내 -->
                <template x-if="results.length === 0 && !loading && query.length > 0 && query.length < minChars">
                    <div class="df-ac-empty">
                        <i class="fas fa-keyboard"></i>
                        <span x-text="`${minChars}자 이상 입력하세요`"></span>
                    </div>
                </template>
            </div>

            <!-- 히든 필드 (폼 전송용) -->
            <input type="hidden"
                   :name="componentId + '-value'"
                   :value="selectedItem ? selectedItem[valueField] : ''">
        </div>

        <!-- ── Autocomplete 독립 스크립트 ── -->
        <script th:inline="javascript">
            if (typeof window.dfAutocomplete !== 'function') {
                window.dfAutocomplete = function (el) {
                    const dataset = el.dataset;

                    return {
                        // ── 설정 ──
                        componentId:   el.id,
                        url:           dataset.url || '',
                        labelField:    dataset.labelField || 'label',
                        valueField:    dataset.valueField || 'value',
                        subLabelField: dataset.subLabelField || '',
                        placeholder:   dataset.placeholder || '검색어를 입력하세요...',
                        minChars:      parseInt(dataset.minChars || '1', 10),
                        eventName:     dataset.eventName || 'autocomplete-selected',
                        maxResults:    parseInt(dataset.maxResults || '10', 10),

                        // ── 상태 ──
                        query:            '',
                        results:          [],
                        isOpen:           false,
                        loading:          false,
                        highlightedIndex: -1,
                        selectedItem:     null,
                        staticItems:      [],

                        // ── 디바운스 ──
                        _debounceTimer: null,

                        init() {
                            // 정적 아이템 파싱
                            const itemsRaw = dataset.items;
                            if (itemsRaw) {
                                try {
                                    this.staticItems = JSON.parse(itemsRaw);
                                } catch (e) {
                                    // 전역 변수명 참조 시도
                                    if (window[itemsRaw] && Array.isArray(window[itemsRaw])) {
                                        this.staticItems = window[itemsRaw];
                                    }
                                }
                            }

                            // 캡처링 단계에서 외부 클릭 감지
                            this._outsideClickListener = (e) => {
                                if (!el.contains(e.target)) {
                                    this.close();
                                }
                            };
                            document.addEventListener('click', this._outsideClickListener, true);
                        },

                        destroy() {
                            if (this._outsideClickListener) {
                                document.removeEventListener('click', this._outsideClickListener, true);
                            }
                            if (this._debounceTimer) {
                                clearTimeout(this._debounceTimer);
                            }
                        },

                        // ── 이벤트 핸들러 ──
                        onFocus() {
                            if (this.query.length >= this.minChars && this.results.length > 0) {
                                this.isOpen = true;
                            }
                        },

                        onInput() {
                            this.highlightedIndex = -1;

                            if (this.query.length < this.minChars) {
                                this.results = [];
                                this.isOpen = false;
                                return;
                            }

                            this.isOpen = true;

                            if (this._debounceTimer) {
                                clearTimeout(this._debounceTimer);
                            }

                            this._debounceTimer = setTimeout(() => {
                                this.search();
                            }, this.staticItems.length > 0 ? 0 : 250);
                        },

                        // ── 검색 ──
                        async search() {
                            const q = this.query.trim();
                            if (q.length < this.minChars) return;

                            // 정적 데이터 검색
                            if (this.staticItems.length > 0) {
                                const lower = q.toLowerCase();
                                this.results = this.staticItems
                                    .filter(item => {
                                        const label = (item[this.labelField] || '').toString().toLowerCase();
                                        const sub = this.subLabelField ? (item[this.subLabelField] || '').toString().toLowerCase() : '';
                                        return label.includes(lower) || sub.includes(lower);
                                    })
                                    .slice(0, this.maxResults);
                                return;
                            }

                            // API 검색
                            if (!this.url) return;

                            this.loading = true;
                            try {
                                const separator = this.url.includes('?') ? '&' : '?';
                                const response = await fetch(`${this.url}${separator}q=${encodeURIComponent(q)}`);
                                if (!response.ok) throw new Error('Network response was not ok');

                                let data = await response.json();

                                // 응답이 배열이 아닌 경우 content 필드 확인 (Spring Page 응답 호환)
                                if (!Array.isArray(data)) {
                                    data = data.content || data.data || data.items || data.results || [];
                                }

                                this.results = data.slice(0, this.maxResults);
                            } catch (err) {
                                console.error('Autocomplete fetch error:', err);
                                this.results = [];
                            } finally {
                                this.loading = false;
                            }
                        },

                        // ── 항목 선택 ──
                        selectItem(item) {
                            this.selectedItem = item;
                            this.query = '';
                            this.results = [];
                            this.isOpen = false;
                            this.highlightedIndex = -1;

                            this.$dispatch(this.eventName, {
                                id:    this.componentId,
                                value: item[this.valueField],
                                label: item[this.labelField],
                                item:  item
                            });
                        },

                        selectHighlighted() {
                            if (this.highlightedIndex >= 0 && this.highlightedIndex < this.results.length) {
                                this.selectItem(this.results[this.highlightedIndex]);
                            }
                        },

                        // ── 선택 해제 ──
                        clearSelection() {
                            this.selectedItem = null;
                            this.query = '';
                            this.results = [];
                            this.$nextTick(() => {
                                if (this.$refs.input) {
                                    this.$refs.input.focus();
                                }
                            });

                            this.$dispatch(this.eventName, {
                                id:    this.componentId,
                                value: null,
                                label: null,
                                item:  null
                            });
                        },

                        clearAndFocus() {
                            this.clearSelection();
                        },

                        clearQuery() {
                            this.query = '';
                            this.results = [];
                            this.isOpen = false;
                            this.$refs.input?.focus();
                        },

                        // ── 키보드 네비게이션 ──
                        navigate(dir) {
                            if (!this.isOpen || this.results.length === 0) return;
                            const len = this.results.length;
                            this.highlightedIndex = (this.highlightedIndex + dir + len) % len;
                            this.$nextTick(() => this.scrollToHighlighted());
                        },

                        scrollToHighlighted() {
                            const list = this.$refs.list;
                            if (!list) return;
                            const item = list.querySelector(`[data-idx="${this.highlightedIndex}"]`);
                            item?.scrollIntoView({ block: 'nearest' });
                        },

                        // ── 닫기 ──
                        close() {
                            this.isOpen = false;
                            this.highlightedIndex = -1;
                        },

                        // ── 검색어 하이라이트 ──
                        highlightMatch(text) {
                            if (!text || !this.query) return text || '';
                            const str = text.toString();
                            const q = this.query.trim();
                            if (!q) return str;

                            const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                            const regex = new RegExp(`(${escaped})`, 'gi');
                            return str.replace(regex, '<span class="df-ac-highlight">$1</span>');
                        },

                        // ── 외부 API: 프로그래밍 방식으로 값 설정 ──
                        setValue(value, label) {
                            this.selectedItem = {};
                            this.selectedItem[this.valueField] = value;
                            this.selectedItem[this.labelField] = label;
                        },

                        getValue() {
                            return this.selectedItem ? this.selectedItem[this.valueField] : null;
                        },

                        getLabel() {
                            return this.selectedItem ? this.selectedItem[this.labelField] : null;
                        },

                        getItem() {
                            return this.selectedItem;
                        }
                    };
                };
            }
        </script>
    </th:block>
</html>
