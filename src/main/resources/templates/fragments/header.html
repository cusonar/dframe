<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="headerFragment">
    <nav class="border-gray-200 px-4 py-1.5 fixed left-0 right-0 top-0 z-50" th:classappend="${@environment.getProperty('style.table_row')}">
        <div class="flex flex-wrap justify-between items-center">
            <div class="flex items-center justify-start rtl:justify-end">
                <!-- 모바일 전용 토글 -->
                <button aria-controls="drawer-navigation" class="p-2 text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:hover:bg-gray-700 dark:focus:ring-gray-600" th:classappend="${@environment.getProperty('style.breadcrumb_item')}"
                        data-drawer-target="drawer-navigation" data-drawer-toggle="drawer-navigation"
                        type="button">
                    <span class="sr-only">Open sidebar</span>
                    <i class="fas fa-bars w-5 h-5 flex items-center justify-center"></i>
                </button>
                <!-- 데스크탑 전용 토글 (Collapsible) -->
                <button class="hidden md:inline-flex items-center p-2 rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:hover:bg-gray-700 dark:focus:ring-gray-600" th:classappend="${@environment.getProperty('style.table')}" id="desktop-sidebar-toggle"
                        type="button">
                    <span class="sr-only">Toggle sidebar</span>
                    <i class="fas fa-bars w-5 h-5 flex items-center justify-center"></i>
                </button>
                <a class="flex ms-2 md:me-24" href="/">
                    <span class="self-center text-2xl font-bold whitespace-nowrap dark:text-white text-blue-600"
                          th:text="${@environment.getProperty('spring.application.name')}"></span>
                </a>
            </div>
            <div class="md:order-2 space-x-3 md:space-x-0 relative" th:classappend="${@environment.getProperty('style.breadcrumb')}">
                <!-- Dropdown Trigger -->
                <button aria-expanded="false"
                        class="flex text-sm bg-gray-800 rounded-full md:me-0 focus:ring-4 focus:ring-gray-300 dark:focus:ring-gray-600"
                        data-dropdown-placement="bottom" data-dropdown-toggle="user-dropdown" id="user-menu-button"
                        type="button">
                    <span class="sr-only">Open user menu</span>
                    <img alt="user photo"
                         class="w-8 h-8 rounded-full" src="https://ui-avatars.com/api/?name=Admin&background=1d4ed8&color=fff">
                </button>

                <!-- Dropdown Menu -->
                <div class="z-50 my-4 w-64 text-base list-none dark:divide-gray-600" th:classappend="${@environment.getProperty('style.dropdown')}"
                     id="user-dropdown">
                    <div class="px-4 py-3">
                        <span class="font-bold" th:classappend="${@environment.getProperty('style.label')}">관리자 님</span>
                        <span class="block truncate" th:classappend="${@environment.getProperty('style.table')}">admin 계정</span>
                        <div class="mt-2 text-xs text-red-500 flex items-center bg-red-50 dark:bg-gray-800 p-1.5 rounded">
                            <i class="far fa-clock mr-1"></i> 세션 만료: <span class="ml-1 font-semibold" id="sessionTimer">30:00</span>
                        </div>
                    </div>
                    <ul aria-labelledby="user-menu-button" class="py-2">
                        <li>
                            <a class="text-sm text-gray-700 dark:text-gray-200" th:classappend="${@environment.getProperty('style.dropdown_item')}"
                               href="#">
                                <i class="fas fa-cog w-4 mr-2 text-gray-400"></i> 설정 (Settings)
                            </a>
                        </li>
                        <li>
                            <form class="hidden" id="logoutForm" method="post" th:action="@{/logout}"></form>
                            <a class="text-sm text-red-600 dark:text-red-500" th:classappend="${@environment.getProperty('style.dropdown_item')}" href="#"
                               onclick="document.getElementById('logoutForm').submit(); return false;">
                                <i class="fas fa-sign-out-alt w-4 mr-2 text-red-500"></i> 로그아웃
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let timeLeft = 30 * 60; // 30분
            const timerElement = document.getElementById('sessionTimer');

            if (timerElement) {
                setInterval(function () {
                    if (timeLeft <= 0) return;
                    timeLeft--;
                    const minutes = Math.floor(timeLeft / 60);
                    const seconds = timeLeft % 60;
                    timerElement.textContent = String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');

                    // 5분 미만일 경우 깜빡임 효과
                    if (timeLeft < 300) {
                        timerElement.parentElement.classList.add('animate-pulse');
                    }
                }, 1000);
            }
        });
    </script>
</th:block>
</html>
