<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <th:block th:fragment="toastFragment">
        <!-- 글로벌 Toast 컨테이너 -->
        <div class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none" x-data>
            <template :key="toast.id" x-for="toast in $store.toast.toasts">
                <div class="flex items-center w-full max-w-xs p-4 text-gray-500 bg-white rounded-lg shadow dark:text-gray-400 dark:bg-gray-800 pointer-events-auto"
                     role="alert"
                     x-data="{ show: false }"
                     x-init="setTimeout(() => show = true, 50); if (toast.duration > 0) setTimeout(() => { show = false; setTimeout(() => $store.toast.remove(toast.id), 200) }, toast.duration)"
                     x-show="show"
                     x-transition:enter="transition ease-out duration-300 transform"
                     x-transition:enter-end="opacity-100 translate-x-0"
                     x-transition:enter-start="opacity-0 translate-x-full"
                     x-transition:leave="transition ease-in duration-200 transform"
                     x-transition:leave-end="opacity-0 translate-x-full"
                     x-transition:leave-start="opacity-100 translate-x-0">

                    <!-- Success Icon -->
                    <template x-if="toast.type === 'success'">
                        <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-green-500 bg-green-100 rounded-lg dark:bg-green-800 dark:text-green-200">
                            <i class="fas fa-check"></i>
                        </div>
                    </template>
                    <!-- Error Icon -->
                    <template x-if="toast.type === 'error'">
                        <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-red-500 bg-red-100 rounded-lg dark:bg-red-800 dark:text-red-200">
                            <i class="fas fa-times"></i>
                        </div>
                    </template>
                    <!-- Warning Icon -->
                    <template x-if="toast.type === 'warning'">
                        <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-orange-500 bg-orange-100 rounded-lg dark:bg-orange-700 dark:text-orange-200">
                            <i class="fas fa-exclamation"></i>
                        </div>
                    </template>
                    <!-- Info Icon -->
                    <template x-if="toast.type === 'info'">
                        <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-blue-500 bg-blue-100 rounded-lg dark:bg-blue-800 dark:text-blue-200">
                            <i class="fas fa-info"></i>
                        </div>
                    </template>

                    <div class="ms-3 text-sm font-normal break-all" x-text="toast.message"></div>

                    <button @click="show = false; setTimeout(() => $store.toast.remove(toast.id), 200)"
                            aria-label="Close"
                            class="ms-auto -mx-1.5 -my-1.5 bg-white text-gray-400 hover:text-gray-900 rounded-lg focus:ring-2 focus:ring-gray-300 p-1.5 hover:bg-gray-100 inline-flex items-center justify-center h-8 w-8 dark:text-gray-500 dark:hover:text-white dark:bg-gray-800 dark:hover:bg-gray-700"
                            type="button">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </template>
        </div>

        <script th:inline="javascript">
            document.addEventListener('alpine:init', () => {
                Alpine.store('toast', {
                    toasts: [],
                    add(type, message, duration = 3000) {
                        const id = Date.now() + Math.random().toString(36).substr(2, 9);
                        this.toasts.push({id, type, message, duration});
                    },
                    remove(id) {
                        this.toasts = this.toasts.filter(t => t.id !== id);
                    },
                    success(message, duration) {
                        this.add('success', message, duration);
                    },
                    error(message, duration) {
                        this.add('error', message, duration);
                    },
                    warning(message, duration) {
                        this.add('warning', message, duration);
                    },
                    info(message, duration) {
                        this.add('info', message, duration);
                    }
                });

                // 전역 window 객체에도 연결해 두어 JS 어디서든 toast.success() 등으로 호출 가능하게 함
                window.toast = {
                    success: (message, duration) => Alpine.store('toast').success(message, duration),
                    error: (message, duration) => Alpine.store('toast').error(message, duration),
                    warning: (message, duration) => Alpine.store('toast').warning(message, duration),
                    info: (message, duration) => Alpine.store('toast').info(message, duration),
                };
            });
        </script>
    </th:block>
</html>
