<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:x-transition="http://www.w3.org/1999/xhtml">
    <th:block th:fragment="iconModalFragment">
        <!-- 공통 아이콘 선택 모달 -->
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4"
             style="display: none;"
             x-data
             x-show="$store.iconModal.isOpen"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-end="opacity-100"
             x-transition:enter-start="opacity-0"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-end="opacity-0"
             x-transition:leave-start="opacity-100">
            <!-- 백드롭 -->
            <div @click="$store.iconModal.close()" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>

            <!-- 모달 패널 -->
            <div class="relative z-10 bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 w-full max-w-2xl flex flex-col"
                 style="max-height: 80vh;"
                 x-show="$store.iconModal.isOpen"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                 x-transition:enter-start="opacity-0 scale-95 translate-y-4"
                 x-transition:leave="transition ease-in duration-150"
                 x-transition:leave-end="opacity-0 scale-95 translate-y-4"
                 x-transition:leave-start="opacity-100 scale-100 translate-y-0">
                <!-- 모달 헤더 -->
                <div class="flex items-center justify-between p-5 border-b border-gray-200 dark:border-gray-700 shrink-0">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center">
                            <i class="fas fa-icons text-white text-xs"></i>
                        </div>
                        <h3 class="text-base font-bold text-gray-900 dark:text-white">Font Awesome 아이콘 선택</h3>
                    </div>
                    <button @click="$store.iconModal.close()"
                            class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors p-1"
                            type="button">
                        <i class="fas fa-times text-lg"></i>
                    </button>
                </div>

                <!-- 검색 바 -->
                <div class="p-4 border-b border-gray-100 dark:border-gray-700 shrink-0">
                    <div class="relative">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                        <input class="w-full pl-9 pr-4 py-2.5 text-sm border border-gray-300 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
                               placeholder="아이콘 이름으로 검색 (예: user, chart, file...)"
                               type="text"
                               x-model="$store.iconModal.iconSearchQuery">
                        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-gray-400"
                              x-show="$store.iconModal.iconSearchQuery"
                              x-text="`${$store.iconModal.filteredIcons.length}개`"></span>
                    </div>
                </div>

                <!-- 아이콘 그리드 -->
                <div class="overflow-y-auto flex-1 p-4">
                    <div class="flex flex-col items-center justify-center py-16 text-gray-400"
                         x-show="$store.iconModal.filteredIcons.length === 0">
                        <i class="fas fa-search text-3xl mb-3"></i>
                        <p class="text-sm">검색 결과가 없습니다.</p>
                    </div>
                    <div class="grid grid-cols-6 sm:grid-cols-8 gap-2">
                        <template :key="icon" x-for="icon in $store.iconModal.filteredIcons">
                            <button :class="$store.iconModal.selectedIcon === icon
                                        ? 'border-blue-500 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 ring-2 ring-blue-500 ring-offset-1'
                                        : 'border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:border-blue-400 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/20'"
                                    :title="icon"
                                    @click="$store.iconModal.selectIcon(icon)"
                                    class="flex flex-col items-center justify-center p-2.5 rounded-xl border transition-all group aspect-square"
                                    type="button">
                                <i :class="`fas fa-${icon}`"
                                   class="text-lg mb-1 transition-transform group-hover:scale-110"></i>
                                <span class="text-[8px] leading-tight truncate w-full text-center opacity-60"
                                      x-text="icon"></span>
                            </button>
                        </template>
                    </div>
                </div>

                <!-- 모달 푸터 -->
                <div class="p-4 border-t border-gray-200 dark:border-gray-700 shrink-0 flex items-center justify-between">
                    <div class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400">
                        <template x-if="$store.iconModal.selectedIcon">
                            <div class="flex items-center gap-2">
                                <div class="w-7 h-7 rounded-lg bg-blue-50 dark:bg-blue-900/30 flex items-center justify-center">
                                    <i :class="`fas fa-${$store.iconModal.selectedIcon}`"
                                       class="text-blue-500 text-sm"></i>
                                </div>
                                <span>선택됨: <strong class="text-gray-800 dark:text-gray-200"
                                                   x-text="$store.iconModal.selectedIcon"></strong></span>
                            </div>
                        </template>
                        <span x-show="!$store.iconModal.selectedIcon">아이콘을 클릭하여 선택하세요.</span>
                    </div>
                    <button @click="$store.iconModal.close()"
                            class="px-4 py-2 text-sm font-medium rounded-lg bg-blue-600 hover:bg-blue-700 text-white transition-colors"
                            type="button">
                        확인
                    </button>
                </div>
            </div>
        </div>

            document.addEventListener('alpine:init', () => {
                Alpine.store('iconModal', {
                    isOpen: false,
                    iconSearchQuery: '',
                    selectedIcon: '',
                    callback: null,

                    get filteredIcons() {
                        const q = this.iconSearchQuery.toLowerCase().trim();
                        if (!q) return FA_FREE_ICONS;
                        return FA_FREE_ICONS.filter(icon => icon.includes(q));
                    },

                    open(initialIcon, callback) {
                        this.selectedIcon = initialIcon || '';
                        this.iconSearchQuery = '';
                        this.callback = callback;
                        this.isOpen = true;
                    },

                    close() {
                        this.isOpen = false;
                    },

                    selectIcon(icon) {
                        this.selectedIcon = icon;
                        if (this.callback) {
                            this.callback(icon);
                        }
                    }
                });

                // 전역 window 객체에 연결
                window.iconModal = {
                    show: (initialIcon, callback) => Alpine.store('iconModal').open(initialIcon, callback),
                    close: () => Alpine.store('iconModal').close()
                };
            });
